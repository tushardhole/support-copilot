[project]
name = "support-copilot"
version = "0.1.0"
description = "Customer Support AI – RAG + tools + multi-agent + guardrails + evals"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM / AI
    "openai>=1.30.0",
    "tiktoken>=0.7.0",

    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # Retries
    "tenacity>=8.3.0",

    # Vector DB + embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Hybrid retrieval
    "rank-bm25>=0.2.2",

    # Doc parsing
    "pypdf>=4.2.0",
    "markdown-it-py>=3.0.0",

    # Agent orchestration
    "langgraph>=0.1.0",

    # Guardrails
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",

    # Evals
    "ragas>=0.1.14",
    "pytest>=8.2.0",

    # Observability
    "langfuse>=2.41.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",

    # Storage
    "sqlmodel>=0.0.19",

    # Dashboard
    "streamlit>=1.35.0",
    "pyyaml>=6.0.1",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app", "dashboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
